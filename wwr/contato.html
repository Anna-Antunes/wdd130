<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Rafting Rush</title>
    <meta name="description"
      content="Entre em contato conosco e viva a aventura do rafting com a RaftRush!">
    <meta name="author" content="Anna Carolina Souza de Almeida Antunes">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/rafting-1.webp" alt="Raft Rush">
        <div id="logo"></div>
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="contato">RaftRush
        </h1>
        <p class="endereco">300 Rua Monte do Pai Inácio, Chapada Diamantina,Bahia
            +55 71 97171 - 8888 raftrush@info.com</p>

        <div class="contato-conteudo">
            <div>
                <form>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">
                    <label for="email-do-usuario">E-mail:</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario">


                    <div class="formulariocontato">
                        <div>
                            <p>Propósito da mensagem</p>
                        </div>
                        <div class="botao-radio">
                            <label>
                                <input type="radio" name="proposito" id="duvida-geral">
                                Dúvida Geral
                            </label>

                            <label>
                                <input type="radio" name="proposito" id="reserva">
                                Pergunta sobre Reserva
                            </label>

                            <label>
                                <input type="radio" name="proposito" id="sugestao">
                                Sugestão
                            </label>
                        </div>

                    </div>
                    <label for="mensagem">Mensagem</label>
                    <textarea name="mensagem" id="mensagem" rows="4"
                      placeholder="Digite aqui"></textarea>
                    <div class="checkbox">
                        <label for="inscrever">Por favor, me inscreva na newsletter mensal
                            <input type="checkbox" name="inscrever" id="inscrever">
                        </label>
                    </div>


                    <button type="submit">Entrar em contato</button>
                </form>
            </div>
            <div>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15557.841266894893!2d-41.373215322408704!3d-12.878095481612084!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x742223abc4785eb%3A0xdf9586310ce5dcfa!2sChapada%20Diamantina!5e0!3m2!1spt-BR!2sbr!4v1791042015594!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>

        <section>
            <h2>Estamos aqui para Servi-lo!</h2>
            <div class="aventura">
                <figure><img src="imagens/rafting.webp" alt="Guia de Rafting">
                    <figcaption>Guia de Rafting</figcaption>
                </figure>
                <figure><img src="imagens/rafting1.webp" alt="Instrutor de Rafting">
                    <figcaption> Instrutor de Rafting</figcaption>
                </figure>
                <figure><img src="imagens/rafting2.webp" alt="Condutor de Rafting">
                    <figcaption>Condutor de Rafting</figcaption>
                </figure>
                <figure><img src="imagens/rafting3.webp" alt="Gerente de operações">
                    <figcaption>Gerente de operações</figcaption>
                </figure>
                <figure><img src="imagens/rafting4.webp" alt="Resgatista Aquático">
                    <figcaption>Resgatista Aquático </figcaption>
                </figure>

            </div>
        </section>
    </main>
    <footer>
        <p>&copy;2026 Raft Rush - Anna Antunes</p>
        <nav class="redes-sociais socialmedia">
            <a href="https://facebook.com">
                <img src="imagens/facebook_220200.webp" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/linkedin_174857.webp" alt="Ícone do LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/instagram_779093.webp" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
