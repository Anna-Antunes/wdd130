<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial | Rafting Rush</title>
    <meta name="description" content="Venha conhecer a RaftRush!">
    <meta name="author" content="Anna Carolina Souza de Almeida Antunes">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/logowebp.webp" alt="Raft Rush">
        <div id="logo"></div>
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="heropage">
            <img src="imagens/testeheroimg.webp" alt="Hero Imagem">
            <div class="botao-contato">
                <h1>Supere seus Limites</h1>
                <p>Crie Memórias!</p>
                <button type="submit">Reserve Agora</button>
            </div>
        </div>
        <div class="indice">
            <figure><img src="imagens/rios.webp" alt="Rio Paraguaçu">
                <img src="imagens/rios-icon.webp" alt="Rio" class="icone">
                <figcaption>Rios</figcaption>
            </figure>
            <figure><img src="imagens/camping.webp" alt="Acampamento">
                <img src="imagens/acampamento-icon.webp" alt="acampamento" class="icone">
                <figcaption> Acampamento</figcaption>
            </figure>
            <figure><img src="imagens/corredeiras.webp" alt="Rafting em Corredeiras">
                <img src="imagens/corredeira-icon.webp" alt="corredeiras" class="icone">
                <figcaption>Corredeiras</figcaption>
            </figure>

        </div>


        <div class="fundoazul">
            <div class="imagem-comercial">
                <img src="imagens/heroimg.webp" alt="Botes no rio">
                <div class="mensagem-comercial">
                    <h2>Mais do que apenas Emoção!</h2>
                    <p>Supere desafios, compartilhe risadas e desfrute das belezas da natureza em
                        uma
                        aventura inesquecível.
                    </p>
                    <a href="passeios.html" class="button">Junte-se a Nós!</a>
                </div>

            </div>
        </div>
    </main>
    <footer>
        <p>&copy;2026 Raft Rush - Anna Antunes</p>
        <nav class="redes-sociais socialmedia">
            <a href="https://facebook.com">
                <img src="imagens/facebook_220200.webp" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/linkedin_174857.webp" alt="Ícone do LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/instagram_779093.webp" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
